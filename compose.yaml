services:
  postgres:
    # Versión menor revisada el 27-11-2026.
    image: postgres:16.16-alpine3.24@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulntrack}
      POSTGRES_USER: ${POSTGRES_USER:-vulntrack_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir una contraseña local de desarrollo}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./sql:/vulntrack/sql:ro
      - ./seed:/vulntrack/seed:ro
      - ./tests:/vulntrack/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: "no"

volumes:
  pgdata:
